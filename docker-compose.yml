services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${API_HOST_PORT:-8000}:8000"

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    environment:
      API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
