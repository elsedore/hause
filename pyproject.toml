[project]
name = "house-price-prediction"
version = "0.1.0"
description = "End-to-end house price prediction web application"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [".venv", "node_modules", "ml/models"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
